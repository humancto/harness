[package]
name         = "harness-daemon"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
description  = "Harness daemon — the `harness` binary."

[lints]
workspace = true

[[bin]]
name = "harness"
path = "src/main.rs"

[features]
default = ["llm", "brain", "fs"]
llm = []
brain = []
fs   = []

[dependencies]
clap                = { workspace = true }
anyhow              = { workspace = true }
tokio               = { workspace = true }
tracing             = { workspace = true }
tracing-subscriber  = { workspace = true }
parking_lot         = { workspace = true }
futures             = { workspace = true }
serde_json          = { workspace = true }
hostname            = { workspace = true }
harness-core        = { workspace = true }
harness-cli         = { workspace = true }
harness-mesh        = { workspace = true }
harness-api         = { workspace = true }
harness-store        = { workspace = true }
harness-capabilities = { workspace = true, features = ["fs"] }
harness-policy       = { workspace = true }
harness-vault        = { workspace = true }
harness-brain        = { workspace = true, features = ["localfast"] }
reqwest             = { workspace = true }
url                 = { workspace = true }

[dev-dependencies]
assert_cmd  = { workspace = true }
predicates  = { workspace = true }
tempfile    = { workspace = true }
async-trait = "0.1"
