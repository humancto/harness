[package]
name         = "harness-api"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
description  = "HTTP and WebSocket API surface (axum)."

[lints]
workspace = true

[dependencies]
harness-core   = { workspace = true }
harness-mesh   = { workspace = true }
harness-policy = { workspace = true }
harness-store  = { workspace = true }
harness-ui     = { workspace = true }
harness-vault  = { workspace = true }
uuid           = { workspace = true }

axum          = { workspace = true }
tokio         = { workspace = true }
tower         = { workspace = true }
tower-http    = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
parking_lot   = { workspace = true }
tracing       = { workspace = true }
thiserror     = { workspace = true }
hex           = { workspace = true }
futures       = { workspace = true }
rand          = { workspace = true }
# 5.5 webhook adapters (ADR-0033): Twilio signature (HMAC-SHA1 is
# Twilio's contract; sha1 already in the lock via axum ws) + outbound
# reply client.
hmac             = { workspace = true }
sha1             = { workspace = true }
base64           = { workspace = true }
serde_urlencoded = { workspace = true }
reqwest          = { workspace = true }

[dev-dependencies]
tokio-tungstenite = { workspace = true }
insta             = { workspace = true }
tempfile          = { workspace = true }
ed25519-dalek     = { workspace = true }
rand              = { workspace = true }
http-body-util    = "0.1"
wiremock          = { workspace = true }
tower             = { workspace = true, features = ["util"] }
