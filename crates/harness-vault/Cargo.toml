[package]
name         = "harness-vault"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
description  = "Tagged credential store for harness capabilities (PRD §10.5)."

[lints]
workspace = true

[dependencies]
serde      = { workspace = true }
toml       = { workspace = true }
thiserror  = { workspace = true }
dirs       = { workspace = true }
tracing    = { workspace = true }
zeroize    = { workspace = true }
# 3.6-encrypted (ADR-0021): encrypted-at-rest store.
blake3           = { workspace = true }
chacha20poly1305 = { workspace = true }
hex              = { workspace = true }
rand             = { workspace = true }
# 5.7 (ADR-0035): signed-JSON shortcut tokens (payload JSON + base64url
# transport; MAC is keyed BLAKE3 — no new crypto deps).
base64     = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile     = { workspace = true }
serial_test  = { workspace = true }
