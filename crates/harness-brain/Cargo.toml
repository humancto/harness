[package]
name         = "harness-brain"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
description  = "Planner runtime and backend tiers."

[lints]
workspace = true

[features]
default   = []
# 3.9 LocalFast backend pulls in reqwest + url. Behind a feature so a
# Template-only build (no Ollama) doesn't compile a network stack.
localfast = ["dep:reqwest", "dep:url"]
# 5.2 Cloud backend (tier 3, Anthropic Messages API). Same optional
# deps; independent of `localfast` so a cloud-only build works.
cloud     = ["dep:reqwest", "dep:url"]

[dependencies]
harness-core = { workspace = true }
async-trait  = "0.1"
serde        = { workspace = true }
serde_json   = { workspace = true }
thiserror    = { workspace = true }
tracing      = { workspace = true }
shlex        = { workspace = true }
jsonschema   = { workspace = true }
reqwest      = { workspace = true, optional = true }
url          = { workspace = true, optional = true }

[dev-dependencies]
tokio        = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock     = { workspace = true }
tracing-test = { workspace = true }
