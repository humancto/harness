[package]
name         = "harness-capabilities"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
description  = "Built-in capability implementations."

[lints]
workspace = true

[features]
default = ["echo", "shell", "llm"]
echo = []
shell = []
llm = ["dep:reqwest", "dep:url", "dep:harness-vault"]

[dependencies]
harness-core   = { workspace = true }
harness-policy = { workspace = true }
harness-vault  = { workspace = true, optional = true }
async-trait    = "0.1"
serde          = { workspace = true }
serde_json     = { workspace = true }
thiserror      = { workspace = true }
tokio          = { workspace = true }
tracing        = { workspace = true }
blake3         = { workspace = true }
parking_lot    = { workspace = true }
reqwest        = { workspace = true, optional = true }
url            = { workspace = true, optional = true }

[dev-dependencies]
wiremock       = { workspace = true }
tracing-test   = { workspace = true }
serial_test    = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.29", default-features = false, features = ["signal"] }
