[package]
name         = "harness-capabilities"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
description  = "Built-in capability implementations."

[lints]
workspace = true

[features]
default = ["echo", "shell", "llm", "brain"]
echo = []
shell = []
llm = ["dep:reqwest", "dep:url", "dep:harness-vault"]
brain = ["dep:harness-brain"]
# 3.10a — fs.list + fs.read; 3.10-fts — fs.search + fs.grep. Opt-in
# (NOT in default) because cap-std + base64 + rusqlite (bundled SQLite
# with FTS5) + regex add transitive deps that minimal consumers (CLI,
# future embedded UIs) shouldn't pay for. Daemon enables explicitly.
fs   = ["dep:cap-std", "dep:base64", "dep:toml", "dep:dirs", "dep:rusqlite", "dep:regex"]
# 3.7 — mcp.<server>.<tool> proxy over subprocess MCP servers. Opt-in
# (NOT in default) because rmcp adds transitive deps (process-wrap,
# chrono, tokio-util codec) that minimal consumers shouldn't pay for.
# Daemon enables explicitly, mirroring `fs`.
mcp  = ["dep:rmcp", "dep:toml"]

[dependencies]
harness-cost = { workspace = true }
harness-core         = { workspace = true }
harness-policy       = { workspace = true }
harness-orchestrator = { workspace = true }
harness-vault  = { workspace = true, optional = true }
harness-brain  = { workspace = true, optional = true }
async-trait    = "0.1"
serde          = { workspace = true }
serde_json     = { workspace = true }
thiserror      = { workspace = true }
tokio          = { workspace = true }
tracing        = { workspace = true }
blake3         = { workspace = true }
parking_lot    = { workspace = true }
futures        = { workspace = true }
reqwest        = { workspace = true, optional = true }
url            = { workspace = true, optional = true }
cap-std        = { workspace = true, optional = true }
base64         = { workspace = true, optional = true }
toml           = { workspace = true, optional = true }
dirs           = { workspace = true, optional = true }
rusqlite       = { workspace = true, optional = true }
regex          = { workspace = true, optional = true }
rmcp           = { workspace = true, optional = true }

[dev-dependencies]
# test-util enables tokio::test(start_paused) for the 4.1 deadline test.
tokio          = { workspace = true, features = ["test-util"] }
wiremock       = { workspace = true }
jsonschema     = { workspace = true }
tracing-test   = { workspace = true }
serial_test    = { workspace = true }
tempfile       = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.29", default-features = false, features = ["signal", "fs"] }
