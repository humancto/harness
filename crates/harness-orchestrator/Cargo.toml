[package]
name         = "harness-orchestrator"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
description  = "DAG executor, scheduler, fanout controller."

[lints]
workspace = true

[dependencies]
harness-core   = { workspace = true }
harness-policy = { workspace = true }
futures        = { workspace = true }
# Runtime-agnostic: this crate itself needs only the sync primitives
# (the into_channel bridge). Workspace feature unification can still
# link more when built alongside the daemon.
tokio          = { workspace = true, default-features = false, features = ["sync"] }
tokio-stream   = { workspace = true }
thiserror      = { workspace = true }
tracing        = { workspace = true }
parking_lot    = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }
