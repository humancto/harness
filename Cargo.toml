[workspace]
resolver = "2"
members = [
    "crates/harness-core",
    "crates/harness-mesh",
    "crates/harness-store",
    "crates/harness-policy",
    "crates/harness-merge",
    "crates/harness-cost",
    "crates/harness-brain",
    "crates/harness-capabilities",
    "crates/harness-orchestrator",
    "crates/harness-api",
    "crates/harness-cli",
    "crates/harness-ui",
    "crates/harness-daemon",
    "crates/harness-vault",
]

[workspace.package]
version      = "0.0.0"
edition      = "2021"
rust-version = "1.85"
authors      = ["Archith Rapaka <archith.rapaka@gmail.com>"]
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/humancto/harness"
homepage     = "https://github.com/humancto/harness"
readme       = "README.md"

[workspace.dependencies]
# Internal — every crate uses path deps inside the workspace.
harness-core         = { path = "crates/harness-core",         version = "0.0.0" }
harness-mesh         = { path = "crates/harness-mesh",         version = "0.0.0" }
harness-store        = { path = "crates/harness-store",        version = "0.0.0" }
harness-policy       = { path = "crates/harness-policy",       version = "0.0.0" }
harness-merge        = { path = "crates/harness-merge",        version = "0.0.0" }
harness-cost         = { path = "crates/harness-cost",         version = "0.0.0" }
harness-brain        = { path = "crates/harness-brain",        version = "0.0.0" }
harness-capabilities = { path = "crates/harness-capabilities", version = "0.0.0" }
harness-orchestrator = { path = "crates/harness-orchestrator", version = "0.0.0" }
harness-api          = { path = "crates/harness-api",          version = "0.0.0" }
harness-cli          = { path = "crates/harness-cli",          version = "0.0.0" }
harness-ui           = { path = "crates/harness-ui",           version = "0.0.0" }
harness-vault        = { path = "crates/harness-vault",        version = "0.0.0" }

# Async runtime
tokio       = { version = "1.42", features = ["full"] }
tokio-util  = { version = "0.7" }
futures     = { version = "0.3" }

# HTTP / networking
axum        = { version = "0.7", features = ["ws", "macros"] }
hyper       = { version = "1.5" }
tower       = { version = "0.5" }
tower-http  = { version = "0.6", features = ["trace", "fs"] }
reqwest     = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
url         = { version = "2.5" }
quinn       = { version = "0.11" }

# Serialization
serde        = { version = "1.0", features = ["derive"] }
serde_json   = { version = "1.0" }
ciborium     = { version = "0.2" }
schemars     = { version = "0.8" }
toml         = { version = "0.8" }
uuid         = { version = "1", features = ["serde", "v7"] }

# Crypto
ed25519-dalek = { version = "2.1", features = ["rand_core", "pkcs8", "zeroize"] }
blake3        = { version = "1.5" }
rand          = { version = "0.8" }
zeroize       = { version = "1.8" }
hex           = { version = "0.4" }

# Storage
rusqlite      = { version = "0.32", features = ["bundled"] }

# Filesystem / paths
dirs          = { version = "5.0" }

# Host identity
hostname      = { version = "0.4" }

# Errors & observability
thiserror            = { version = "2.0" }
anyhow               = { version = "1.0" }
tracing              = { version = "0.1" }
tracing-subscriber   = { version = "0.3", features = ["env-filter", "json"] }

# Concurrency primitives
parking_lot          = { version = "0.12" }
dashmap              = { version = "6" }
arc-swap             = { version = "1.7" }

# TLS / certificate machinery for QUIC transport
rustls               = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen                = { version = "0.13", default-features = false, features = ["pem", "ring"] }
tokio-stream         = { version = "0.1" }
x509-parser          = { version = "0.16" }
pki-types            = { package = "rustls-pki-types", version = "1" }
bytes                = { version = "1" }

# mDNS service discovery (item 1.3)
mdns-sd              = { version = "0.13", default-features = false, features = ["async"] }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Web UI embedding (item 1.10)
rust-embed   = { version = "8.5", features = ["interpolate-folder-path"] }
mime_guess   = { version = "2.0" }

# Admin auth (item 2.6)
argon2       = { version = "0.5" }
constant_time_eq = { version = "0.3" }

# Test deps (used as dev-dependencies in crates that need them)
assert_cmd        = { version = "2.0" }
predicates        = { version = "3.1" }
proptest          = { version = "1.5" }
insta             = { version = "1.40", features = ["yaml"] }
# pinned: 0.6.5+ uses let-chains (Rust 1.86+); workspace MSRV is 1.85.
wiremock          = { version = "=0.6.2" }
rstest            = { version = "0.23" }
tempfile          = { version = "3.13" }
tokio-tungstenite = { version = "0.24" }
serial_test       = { version = "3" }
tracing-test      = { version = "0.2" }

# POSIX argv tokenization (Phase 3.8 brain.plan Template). 1.3.0 contains
# the post-CVE-2024-fix release.
shlex             = "1.3"

# JSON-Schema validator for Phase 3.9 plan validation. 0.26 line is
# stable enough for compile + validate; we don't use remote refs or
# the `cli` feature, hence default-features = false.
jsonschema        = { version = "0.26", default-features = false }

# Capability-based filesystem confinement (Phase 3.10a fs.list / fs.read).
# `cap_std::fs::Dir` enforces O_NOFOLLOW-equivalent on every component;
# eliminates the canonicalize/open TOCTOU window. 4.0.x is the current
# major; the API surface we use is identical to 3.x.
cap-std           = "4"

# Standard JSON binary carrier (Phase 3.10a — fs.read with encoding=base64).
base64            = "0.22"

# Line-oriented pattern matching (Phase 3.10-fts — fs.grep). Linear-time
# engine; already in the tree transitively via tracing-subscriber's
# env-filter, so this adds no new transitive weight.
regex             = "1.11"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn        = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms              = { level = "warn", priority = -1 }
unreachable_pub               = "warn"
unused_must_use               = "deny"

[workspace.lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pragmatic opt-outs from pedantic — these fire too often on legitimate code.
module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
# Real bugs we want to deny outright.
unwrap_used      = "deny"
expect_used      = "warn"
panic            = "warn"
todo             = "warn"
dbg_macro        = "deny"
print_stderr     = "warn"
print_stdout     = "warn"

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = "symbols"
panic         = "abort"

[profile.dev]
debug = "limited"
